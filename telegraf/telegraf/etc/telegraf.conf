[agent]
  interval = "60s"
  round_interval = true
  flush_interval = "60s"
  flush_jitter = "0s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  hostname = "windows-pc"

[[outputs.influxdb]]
  urls = ["http://127.0.0.1:8086"]
  database = "influx"
  username = "admin"
  password = "admin"
  timeout = "5s"

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = false

[[inputs.mem]]

[[inputs.swap]]

[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay", "squashfs"]

[[inputs.diskio]]

[[inputs.net]]
  interfaces = ["Ethernet"]
